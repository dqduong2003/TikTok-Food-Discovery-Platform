<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Food Places</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="public/favicon.ico" />
    <style>
        :root {
            --bg: #fdfaf6;
            --stone-dark: #2d2a28;
            --terracotta: #e2725b;
            --sage: #8a9a5b;
            --cobalt: #2e5a88;
            --terrazzo-pattern: 
                radial-gradient(circle at 20% 30%, #e2725b 2px, transparent 0),
                radial-gradient(circle at 80% 10%, #2e5a88 4px, transparent 0),
                radial-gradient(circle at 40% 70%, #8a9a5b 3px, transparent 0),
                radial-gradient(circle at 70% 85%, #d4a373 5px, transparent 0),
                radial-gradient(circle at 10% 90%, #2d2a28 2px, transparent 0);
        }
        
        body {
            background-color: var(--bg);
            background-image: var(--terrazzo-pattern);
            background-size: 400px 400px;
            font-family: 'Inter', sans-serif;
            color: var(--stone-dark);
            overflow: hidden; /* Prevent body scroll, handle in app */
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            pointer-events: none;
            background: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
            z-index: 50;
        }

        /* Map Grid Pattern */
        .map-grid-pattern {
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--stone-dark);
            border-radius: 2px;
        }

        /* Animations */
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }
        .marker-pulse::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            background: inherit;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
            animation: pulse-ring 2s infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
